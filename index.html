<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f9fa;--fg:#0f2a33;--mut:#5a7480;--line:#d3e3e8;--hd:#0e5a6b;--hdf:#fff;
--M:#ffe6a8;--E:#ffcfbf;--FD:#e2f2a6;--EO:#f2cdf6;--OFF:#e3ebee;--L:#c4efd3;--Mf:#7a4a00;--Ef:#8a2c14;--FDf:#4a5f00;--EOf:#7a1f8a;--OFFf:#4d6470;--Lf:#146339;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0a1a21;--fg:#e6f3f6;--mut:#8fb0ba;--line:#21404b;--hd:#136b7e;
--M:#5b4413;--E:#5e2b1f;--FD:#4a5a14;--EO:#55216a;--OFF:#1f3540;--L:#1d5538;--Mf:#ffe3a0;--Ef:#ffd0c0;--FDf:#e6f5a8;--EOf:#f5ccfb;--OFFf:#a9c2cb;--Lf:#bff2cf}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0a1a21;--fg:#e6f3f6;--mut:#8fb0ba;--line:#21404b;--hd:#136b7e;
--M:#5b4413;--E:#5e2b1f;--FD:#4a5a14;--EO:#55216a;--OFF:#1f3540;--L:#1d5538;--Mf:#ffe3a0;--Ef:#ffd0c0;--FDf:#e6f5a8;--EOf:#f5ccfb;--OFFf:#a9c2cb;--Lf:#bff2cf}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,Arial,sans-serif;padding:12px;-webkit-text-size-adjust:100%}
h1{font-size:20px;margin:0 0 4px}p{margin:0 0 10px;color:var(--mut);font-size:12px}
.leg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pill{border-radius:99px;padding:4px 10px;font-size:11px;font-weight:600}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:max-content}
th,td{border:1px solid var(--line);text-align:center;padding:0;font-size:12px}
th{background:var(--hd);color:var(--hdf);padding:5px 0;width:37px;min-width:37px;font-weight:600}
th.d{position:sticky;left:0;z-index:2;text-align:left;padding-left:8px;width:104px;min-width:104px;box-sizing:border-box}
td.n{position:sticky;left:0;z-index:1;background:var(--bg);text-align:left;padding:2px 6px;width:104px;min-width:104px;max-width:104px;box-sizing:border-box;line-height:1.2;overflow:hidden}
td.n b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:3px 0 0}
td.n i{display:block;font-style:normal;font-size:10px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 0 3px}
td.c{height:46px;cursor:pointer;font-weight:700;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
tr.cov td{background:var(--bg);color:var(--mut);height:28px}
tr.cov td.n{font-weight:600;padding:0 6px}
.f{font-weight:400;font-size:10px;display:block}
.tot{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:14px}
.tc{border:1px solid var(--line);border-radius:8px;padding:8px}
.tc b{display:block;font-size:13px}.tc i{font-style:normal;font-size:11px;color:var(--mut);display:block;margin-bottom:6px}
.tc span{display:inline-block;border-radius:99px;padding:1px 7px;font-size:11px;font-weight:600;margin:0 3px 3px 0}
h2{font-size:14px;margin:16px 0 0}
.bar{display:flex;gap:8px;margin:10px 0;align-items:center}.bar #wl{flex:1;text-align:center;font-weight:600;font-size:13px}
button{font:inherit;font-size:13px;padding:10px 14px;min-height:42px;touch-action:manipulation;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}

/* modern look */
body{padding:14px}
h1{font-size:24px;letter-spacing:-.02em;margin:0 0 2px;color:var(--hd)}
table{border-collapse:separate;border-spacing:5px}
th,td{border:none}
th{background:transparent;color:var(--mut);font-size:11px;font-weight:600;width:44px;min-width:44px;padding:6px 0}
th.d{background:var(--bg);width:112px;min-width:112px;padding-left:10px}
td.n{background:var(--bg);border-radius:12px;width:112px;min-width:112px;max-width:112px;padding:4px 10px;box-shadow:inset 0 0 0 1px var(--line),6px 0 0 0 var(--bg)}
td.c{height:54px;width:44px;border-radius:12px;font-size:14px}
tr.cov td{background:transparent;height:30px}
tr.cov td.n{box-shadow:6px 0 0 0 var(--bg);background:var(--bg);font-weight:600}
.wrap{border:none;border-radius:0;margin:0 -14px;padding:0 14px 6px}
button{border-radius:12px;font-weight:600}
#prev,#next{width:46px;padding:0;background:var(--hd);color:var(--hdf);border-color:transparent}
.tc{border-radius:16px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.pill{padding:5px 11px}
td.c{box-shadow:inset 0 -2px 0 rgba(0,0,0,.06)}
.tc{background:var(--bg);border:1px solid var(--line)}
h2{font-size:15px;margin:20px 0 0}
td.n b{white-space:normal;line-height:1.15}

/* themed name column */
:root{--nb:#d4ebef;--nm:#0e5a6b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--nb:#12404c;--nm:#9fd8e4}}
:root[data-theme="dark"]{--nb:#12404c;--nm:#9fd8e4}
th.d{background:var(--hd)}
td.n,tr.cov td.n{background:var(--nb)}
td.n b{color:var(--nm)}
td.n i{color:var(--fg);opacity:.75}

/* modern bigger cells */
table{border-spacing:6px}
th{width:48px;min-width:48px;font-size:11px}
th.d{width:124px;min-width:124px;border-radius:12px;color:var(--hdf);padding-left:12px}
td.n{width:124px;min-width:124px;max-width:124px;border-radius:14px;box-shadow:6px 0 0 0 var(--bg)}
td.c{height:58px;width:48px;border-radius:14px;font-size:15px;box-shadow:none}
tr.cov td.n{box-shadow:6px 0 0 0 var(--bg)}
th{width:44px;min-width:44px}td.c{width:44px}
#rn{font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}

button:disabled{opacity:.35}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:10px}
.dc{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.dh{background:var(--nb);border-radius:12px;padding:8px 12px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.dh button{padding:8px 10px;min-height:36px;font-size:12px;white-space:nowrap}
.nodl .ci{display:none}
.dh b{display:block;color:var(--nm);font-size:14px}.dh i{font-style:normal;font-size:12px;opacity:.8}
.wt{font-size:11px;font-weight:600;color:var(--mut);margin:10px 0 5px}
.wr{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.ch{text-align:center;font-size:10px;color:var(--mut);line-height:1.25}
.ch small{display:block;font-size:10px}
.ch em{display:block;font-style:normal;font-weight:700;font-size:12px;border-radius:9px;padding:7px 0;margin-top:3px}
:root{--fr:#d9822b;--frt:#b85c0a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--frt:#f2a65a}}
:root[data-theme="dark"]{--frt:#f2a65a}
th.fri{background:var(--fr);color:#fff}
.ch.fri{color:var(--frt);font-weight:700}
#hs{font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);flex:1;min-width:0}

/* hairline borders */
:root{--hl:rgba(14,90,107,.4)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hl:rgba(159,216,228,.4)}}
:root[data-theme="dark"]{--hl:rgba(159,216,228,.4)}
th,td.c,td.n,th.d,.dc,.dh,.ch em{border:1px solid var(--hl)}
table{border-spacing:6px 12px}

/* joined columns */
table{border-spacing:0 10px}
th,td.c,td.n{border-radius:0;border-width:1px 0 1px 1px;box-shadow:none}
td.n{border-radius:14px 0 0 14px;border-right-width:0}
th.d{border-radius:12px 0 0 12px}
td.c:last-child{border-right-width:1px;border-radius:0 14px 14px 0}
th:last-child{border-right-width:1px;border-radius:0 12px 12px 0}
tr.cov td.n{box-shadow:none}

/* beautiful table theme */
:root{--card:#fff;--card2:#edf6f8;--zb:rgba(14,90,107,.045);--fb:rgba(240,138,75,.12);--hd1:#12768b;--hd2:#0b4f60}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#0f2229;--card2:#133039;--zb:rgba(159,216,228,.05);--fb:rgba(240,138,75,.16);--hd1:#1a7d92;--hd2:#0f5668}}
:root[data-theme="dark"]{--card:#0f2229;--card2:#133039;--zb:rgba(159,216,228,.05);--fb:rgba(240,138,75,.16);--hd1:#1a7d92;--hd2:#0f5668}
.wrap{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 28px rgba(14,90,107,.14);overflow-x:auto;margin:0;padding:0}
#tb{border-collapse:separate;border-spacing:0;border:0;width:max-content;min-width:100%}
#tb th{background:linear-gradient(180deg,var(--hd1),var(--hd2));color:#fff;border:0;border-left:1px solid rgba(255,255,255,.16);border-radius:0;padding:9px 0 8px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;width:46px;min-width:46px;box-shadow:none}
#tb th .f{font-size:15px;letter-spacing:0;text-transform:none;font-weight:700;margin-top:2px}
#tb th.d{text-align:left;padding-left:14px;font-size:11px;width:140px;min-width:140px;border-left:0}
#tb th.fri{background:linear-gradient(180deg,#f7a862,#e0782b)}
#tb td{border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none}
#tb td.c{height:58px;width:46px;min-width:46px;border-left:1px solid var(--line);background:transparent}
#tb tr:nth-child(even) td.c{background:var(--zb)}
#tb td.c.fri{background:var(--fb)}
#tb td.n{background:var(--card);width:140px;min-width:140px;max-width:140px;padding:6px 10px;text-align:left;box-shadow:inset -1px 0 0 var(--line)}
#tb tr:nth-child(even) td.n{background:var(--card2)}
#tb tr:last-child td{border-bottom:0}
.nm{display:flex;align-items:center;gap:8px}
.av{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--hd1),var(--hd2));color:#fff;font-weight:700;font-size:12px}
#tb td.n b{color:var(--fg);font-size:12px;white-space:normal;line-height:1.15;padding:0}
#tb td.n i{color:var(--mut);opacity:1;font-size:10.5px;padding:0}
.chip{display:inline-block;min-width:36px;padding:8px 4px;border-radius:11px;font-weight:700;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.1)}

/* lovable table */
body{background:linear-gradient(180deg,#e6f5f6 0%,#fff6ec 100%) fixed;font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:linear-gradient(180deg,#0a1a21 0%,#17202a 100%) fixed}}
:root[data-theme="dark"] body{background:linear-gradient(180deg,#0a1a21 0%,#17202a 100%) fixed}
.wrap{background:transparent;border:0;box-shadow:none;border-radius:0;overflow-x:auto;margin:0 -14px;padding:0 14px 8px}
#tb{border-spacing:0 8px}
#tb th{border:0;border-radius:0;box-shadow:none}
#tb th.d{border-radius:16px 0 0 16px}
#tb th:last-child{border-radius:0 16px 16px 0}
#tb th.tdy::after{content:"";display:block;width:6px;height:6px;border-radius:50%;background:#ffd45e;margin:4px auto 0}
#tb td{border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;box-shadow:none}
#tb tr:nth-child(even) td.c,#tb tr:nth-child(even) td.n{background:var(--card)}
#tb td.c{height:64px;border-left:0;background-color:var(--card)}
#tb td.n{border-left:1px solid var(--line);border-radius:18px 0 0 18px;background:var(--card);box-shadow:none}
#tb td.c:last-child{border-right:1px solid var(--line);border-radius:0 18px 18px 0}
#tb td.c.fri{background-image:linear-gradient(var(--fb),var(--fb))}
#tb td.c.tdy{background-image:linear-gradient(rgba(255,205,86,.32),rgba(255,205,86,.32))}
#tb tr:last-child td{border-bottom:1px solid var(--line)}
.av{background:linear-gradient(135deg,var(--a1,var(--hd1)),var(--a2,var(--hd2)));box-shadow:0 2px 6px rgba(0,0,0,.18)}
.chip{display:inline-flex;flex-direction:column;align-items:center;gap:1px;min-width:38px;padding:5px 3px 4px;border-radius:14px;font-size:11px;font-weight:800;line-height:1.1;box-shadow:0 2px 0 rgba(0,0,0,.08);transition:transform .12s}
.chip .ei{font-size:16px;line-height:1}
.chip:active{transform:scale(.88)}
.ch em{line-height:1.2}
.chip{padding:10px 4px;font-size:13px}


/* mobile table: one week at a time */
.seg{display:flex;gap:6px;margin:10px 0 6px}
.seg button{flex:1;min-height:44px;font-size:13px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--fg);padding:6px 4px}
.seg button.on{background:linear-gradient(180deg,var(--hd1),var(--hd2));color:#fff;border-color:transparent}
.wrap{overflow:visible;margin:0;padding:0 0 8px}
#tb{table-layout:fixed;width:100%;min-width:0;border-spacing:0 6px}
#tb th{width:auto;min-width:0;padding:7px 0}
#tb th.d{width:34%;min-width:0;padding-left:10px}
#tb th .f{font-size:16px}
#tb td.n{width:34%;min-width:0;max-width:none;padding:6px 6px 6px 8px}
#tb td.c{width:auto;min-width:0;height:54px;padding:0}
#tb .chip{min-width:0;width:80%;max-width:40px;padding:10px 0;font-size:12px}
#tb td.n b{font-size:12px;word-break:break-word}
#tb td.n i{font-size:10px;display:block;line-height:1.2}
@media (max-width:480px){#tb .av{display:none}}
